services:
  aurestella-api:
    build: .
    container_name: aurestella_ia
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYXIS_API_KEY=${PYXIS_API_KEY}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - pyxis_net
  
  db:
    image: pgvector/pgvector:pg15
    container_name: aurestella_telemetry
    restart: always
    environment:
      POSTGRES_USER: pyxis_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: telemetria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pyxis_net

volumes:
  pgdata:

networks:
  pyxis_net: